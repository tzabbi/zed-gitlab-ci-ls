id = "gitlab-ci-ls"
name = "gitlab-ci-ls"
version = "1.1.0"
schema_version = 1
authors = ["Tom Zaspel <tom@zaspel.it>"]
description = "GitLab CI language support with shell highlighting and gitlab-ci-ls"
repository = "https://github.com/tzabbi/zed-gitlab-ci-ls"

[language_servers.gitlab-ci]
name = "gitlab-ci-ls"
languages = ["Gitlab-CI"]

[language_servers.gitlab-ci.language_ids]
"Gitlab-CI" = "yaml"

[language_servers.gitlab-ci-bash-ls]
name = "gitlab-ci-bash-ls"
languages = ["Gitlab-CI"]

[language_servers.gitlab-ci-bash-ls.language_ids]
"Gitlab-CI" = "yaml"

[grammars.yaml]
repository = "https://github.com/zed-industries/tree-sitter-yaml"
rev = "baff0b51c64ef6a1fb1f8390f3ad6015b83ec13a"
